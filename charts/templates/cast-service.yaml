apiVersion: apps/v1
kind: Deployment
metadata:
  name: cast-service
spec:
  replicas: {{ .Values.replicaCount }}
  selector:
    matchLabels:
      app: cast-service
  template:
    metadata:
      labels:
        app: cast-service
    spec:
      imagePullSecrets:
        {{- toYaml .Values.imagePullSecrets | nindent 8 }}
      containers:
        - name: cast-service
          image: "{{ .Values.cast.image.repository }}:{{ .Values.cast.image.tag }}"
          imagePullPolicy: {{ .Values.cast.image.pullPolicy }}
          command:
            - sh
            - -c
            - {{ .Values.command.value | quote }}
          ports:
            - containerPort: {{ .Values.cast.service.targetPort }}
          env:
            - name: DATABASE_URI
              value: {{ .Values.cast.env.DATABASE_URI | quote }}
          livenessProbe:
            httpGet:
              path: {{ .Values.cast.probePath }}
              port: {{ .Values.cast.service.targetPort }}
            initialDelaySeconds: 20
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: {{ .Values.cast.probePath }}
              port: {{ .Values.cast.service.targetPort }}
            initialDelaySeconds: 20
            periodSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: cast-service
spec:
  type: {{ .Values.cast.service.type }}
  selector:
    app: cast-service
  ports:
    - port: {{ .Values.cast.service.port }}
      targetPort: {{ .Values.cast.service.targetPort }}
      nodePort: {{ .Values.cast.service.nodePort }}
